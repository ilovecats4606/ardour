name: Build Ardour CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build Ardour on Ubuntu Noble
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Enable Ubuntu Source Repositories
      run: |
        # Enables the deb-src repositories required by the 'build-dep' command
        sudo sed -i 's/^#\s*deb-src/deb-src/g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # Installs base tools and instantly triggers the platform build blueprint for Ardour
        sudo apt-get install -y build-essential pkg-config python3
        sudo apt-get build-dep -y ardour

    - name: Configure Build System
      run: ./waf configure --optimize --with-backends=dummy,alsa,jack

    - name: Compile Code
      run: ./waf -j$(nproc)
