name: Build Ardour CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build Ardour on Ubuntu Noble
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Enable Ubuntu Source Repositories
      run: |
        # Target the Ubuntu 24.04 DEB822 format to unlock deb-src architecture
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config python3 libjpeg-dev
        sudo apt-get build-dep -y ardour

    - name: Configure Build System
      run: ./waf configure --optimize --with-backends=dummy,alsa,jack

    - name: Compile Code
      run: ./waf -j$(nproc)

    - name: Package Compiled Binaries
      run: |
        # Creates an archive containing the compiled build workspace folder
        tar -czf ardour-build.tar.gz build/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ardour-compiled-binary
        path: ardour-build.tar.gz
        retention-days: 7
