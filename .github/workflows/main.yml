name: Build Ardour CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build Ardour on Ubuntu
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          python3 \
          libglib2.0-dev \
          libgtk2.0-dev \
          libpango1.0-dev \
          libcairo2.0-dev \
          libasound2-dev \
          libjack-jackd2-dev \
          liblrdf0-dev \
          libsamplerate0-dev \
          libsndfile1-dev \
          liblilv-dev \
          libsuil-dev \
          libboost-all-dev \
          libfftw3-dev \
          aubio-tools \
          libxml2-dev

    - name: Configure Build System
      run: ./waf configure --optimize --with-backends=dummy,alsa,jack

    - name: Compile Code
      run: ./waf -j$(nproc)
